schema: spec-driven

# Контекст показывается AI при создании каждого артефакта OpenSpec.
# Текст правил не дублируется: единый источник — .claude/constitution/*.md.
context: |
  Правила проекта — в .claude/constitution/*.md (прочитай все перед созданием артефактов)
  и в корневом CLAUDE.md. Сервис бронирования переговорок: HTTP + in-memory хранилище,
  только stdlib. При неоднозначности требований — вопрос пользователю, не догадка.

rules:
  specs:
    - >-
      Формат сценария (перекрывает WHEN/THEN-шаблон из инструкций CLI). Заголовок —
      markdown "#### Scenario: <имя>": его валидирует openspec и по нему же сверяет
      блоки MODIFIED, менять нельзя. Тело — блок ```gherkin с шагами Given / When /
      Then / And. Given и When обязательны: предусловие есть всегда, сценарий,
      начинающийся с When, — нарушение формата. Значения, которых в шаге несколько,
      оформляются data table Gherkin — строками с "|" сразу под шагом, без
      разделительной строки markdown.
    - >-
      Сценарий описывает результат исчерпывающе. Обязательно: конкретный HTTP-статус
      вместо слова «ошибка»; точное количество (ровно одна бронь создана, в выдаче две
      записи); что НЕ произошло (существующая бронь не изменена, новая не создана,
      других записей в комнате нет); полный вход в Given — конкретная комната и границы
      интервала в RFC3339, а не «занятое время».
    - >-
      Не фиксируются: дословные тексты в поле error, порядок элементов, если контракт
      его не гарантирует, внутренние структуры, которых нет в ответе. Спека описывает
      наблюдаемое клиентом, а не реализацию.
    - >-
      Граничные случаи описываются явно: обе стороны границы интервала, совпадение
      начала одной брони с концом другой, вложенные и частично пересекающиеся интервалы.
      Пробел в требованиях — вопрос пользователю, не догадка в сценарии.
  tasks:
    - В каждой группе задач тестовая задача идёт первой (red до green, .claude/constitution/10-tdd.md).
    - >-
      Финальная группа обязана содержать две задачи-чекбокса: самоаудит "сценарий -> тест";
      полный make ai-check (один раз на change, после закрытия всех задач реализации).
  design:
    - Решения, противоречащие .claude/constitution/*, недопустимы; конфликт — вопрос пользователю.
